[project]
language = "rust"

[verification]
base = "origin/main"

# Which framework's output the run is classified against. One of: cargo,
# pytest, javascript (Jest/Vitest), go. Named explicitly rather than sniffed
# from output, because inferring it from text the candidate controls could turn
# a broken invocation into a red/green proof. An unrecognized value is an error
# rather than a silent fallback to the Rust classifier.
framework = "cargo"

# Note: if the test command's program is missing, WitDiff still writes a receipt
# with the integrity findings and reports what to install. Pass
# `--install-toolchains` to have it run the project's own installer first (a
# committed mvnw or gradlew), which downloads the version the repository pins.
# It never installs anything by default and never picks a version itself.
test_command = ["cargo", "test", "--workspace", "--all-targets", "--all-features"]
test_globs = [
  "tests/*.rs",
  "tests/**/*.rs",
  "**/tests/*.rs",
  "**/tests/**/*.rs"
]
extra_test_paths = ["integration"]
block_on_integrity_findings = true
max_output_bytes = 16384

# Wall-clock deadline in seconds for each individual test command run.
# On expiry the command is killed and recorded as timed_out with
# failure_kind = "timeout", which never satisfies a proof. A hung suite is a
# fact about the candidate, not a WitDiff malfunction, so it is reported
# rather than allowed to block. Remove the key to disable the deadline.
timeout_secs = 900

# Changed-code mutation analysis. Supplementary evidence only: it never changes
# the verification status. Off by default because each mutant costs a full test
# run. Bounds are mandatory, since mutation cost is otherwise unbounded; the
# truncation is deterministic.
mutation = false
max_mutants = 25
max_mutants_per_function = 5

# Optional: sign the receipt with an Ed25519 key (ADR-0022).
#
# The signature proves the receipt was not edited after the run and describes the
# code the verification digest names. It does NOT prove who produced it.
#
# WitDiff reads the key and never creates, stores, copies or logs one. The path
# is a secret *location*, not a secret value: pointing at a key inside the
# repository publishes it.
#
# signing_key = "/run/secrets/witdiff-signing-key.pem"
# Make an unsigned receipt fail a CI gate rather than pass quietly.
# signing_failure_exit_code = 2

# ---------------------------------------------------------------------------
# Gate policy
# ---------------------------------------------------------------------------
#
# Which results count as a pass, committed once rather than restated as flags
# on every invocation. The command-line flags that correspond to these still
# work, but they may only *tighten* this policy: leaving `--strict` off cannot
# relax a `strict = true` here, or every developer could undo what CI enforces.
#
# The set of questions is deliberately small, and deliberately not a list of
# acceptable statuses. An allow-list would let a repository write
# `pass = ["not_verified"]` and defeat the tool by configuration. Policy
# decides how strictly a verdict is judged, never which verdicts exist.
[gate]
# Require exactly `verified`, refusing `verified_with_warnings`.
strict = false

# Treat "nothing to prove" as a failure, for repositories that require a test
# change with every pull request. With this off, a documentation-only change
# passes and is reported as *nothing to prove*, so a pass is never mistaken for
# a proof.
fail_on_no_changed_tests = false

# Require the receipt to carry a signature. This is the one requirement about
# the receipt document rather than about the verdict, which is why it is
# expressed here and not as a flag. It applies uniformly: a receipt for a change
# with no tests must be signed too, because an operator who asked for signatures
# asked for them on every receipt.
#
# Needs `verification.signing_key` to be set as well; otherwise every run fails
# its gate, which is the intended reading of demanding what nobody produced.
# require_signature = true
