[project]
language = "rust"

[verification]
base = "origin/main"
test_command = ["cargo", "test", "--workspace", "--all-targets", "--all-features"]
test_globs = [
  "tests/*.rs",
  "tests/**/*.rs",
  "**/tests/*.rs",
  "**/tests/**/*.rs"
]
extra_test_paths = ["integration"]
block_on_integrity_findings = true
max_output_bytes = 16384

# Wall-clock deadline in seconds for each individual test command run.
# On expiry the command is killed and recorded as timed_out with
# failure_kind = "timeout", which never satisfies a proof. A hung suite is a
# fact about the candidate, not a WitDiff malfunction, so it is reported
# rather than allowed to block. Remove the key to disable the deadline.
timeout_secs = 900

# Changed-code mutation analysis. Supplementary evidence only: it never changes
# the verification status. Off by default because each mutant costs a full test
# run. Bounds are mandatory, since mutation cost is otherwise unbounded; the
# truncation is deterministic.
mutation = false
max_mutants = 25
max_mutants_per_function = 5
