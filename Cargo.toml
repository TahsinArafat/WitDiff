[workspace]
members = [
  "crates/witdiff-core",
  "crates/witdiff-cli",
  "crates/witdiff-mcp",
]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.78"
authors = ["TahsinArafat <146520753+TahsinArafat@users.noreply.github.com>"]
repository = "https://github.com/TahsinArafat/WitDiff"

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = true, features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
globset = "0.4"
hex = "0.4"
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
shell-words = "1.1"
syn = { version = "3", features = ["full", "extra-traits", "visit"] }
tempfile = "3.12"
toml = "0.8"
