name: Bug report
description: Report incorrect WitDiff behavior
title: "[bug] "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include Git shape, base ref, command, and exact status/receipt fields.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected conservative behavior
    validations:
      required: true
